<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">GreenREFORM-EU - Simultaneity background</title>
  <desc id="d">The sparsity pattern of one large simultaneous system, with a coupling band between two subsystems.</desc>
  <defs>
    <pattern id="faint" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="26" height="26" rx="5" fill="#141C25"/>
    </pattern>
    <pattern id="blue" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="26" height="26" rx="5" fill="#2D2BE0"/>
    </pattern>
    <pattern id="bone" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="26" height="26" rx="5" fill="#F1EEE6"/>
    </pattern>
    <pattern id="mint" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="26" height="26" rx="5" fill="#19E3A7"/>
    </pattern>

    <clipPath id="diag">
      <rect x="-600" y="470" width="3200" height="180" transform="rotate(-31 960 540)"/>
    </clipPath>
    <clipPath id="blockA"><rect x="200" y="600" width="360" height="240"/></clipPath>
    <clipPath id="blockB"><rect x="1240" y="240" width="400" height="240"/></clipPath>
    <clipPath id="bridge"><rect x="1120" y="440" width="120" height="80"/></clipPath>

    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2D2BE0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2D2BE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloMint" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#19E3A7" stop-opacity=".38"/>
      <stop offset="1" stop-color="#19E3A7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".72">
      <stop offset=".45" stop-color="#0C1116" stop-opacity="0"/>
      <stop offset="1" stop-color="#05080B" stop-opacity=".95"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0C1116"/>
  <rect width="1920" height="1080" fill="url(#faint)"/>

  <ellipse cx="960" cy="540" rx="900" ry="520" fill="url(#halo)"/>
  <ellipse cx="1180" cy="480" rx="420" ry="300" fill="url(#haloMint)"/>

  <g clip-path="url(#diag)" opacity=".92"><rect width="1920" height="1080" fill="url(#blue)"/></g>
  <g clip-path="url(#blockA)" opacity=".9"><rect width="1920" height="1080" fill="url(#bone)"/></g>
  <g clip-path="url(#blockB)" opacity=".9"><rect width="1920" height="1080" fill="url(#bone)"/></g>
  <g clip-path="url(#bridge)"><rect width="1920" height="1080" fill="url(#mint)"/></g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <g stroke="#F1EEE6" stroke-opacity=".28" stroke-width="2">
    <path d="M80 56v18M280 56v18M480 56v18M680 56v18M880 56v18M1080 56v18M1280 56v18M1480 56v18M1680 56v18M1840 56v18"/>
    <path d="M80 1024v-18M280 1024v-18M480 1024v-18M680 1024v-18M880 1024v-18M1080 1024v-18M1280 1024v-18M1480 1024v-18M1680 1024v-18M1840 1024v-18"/>
    <path d="M56 120h18M56 320h18M56 520h18M56 720h18M56 920h18"/>
    <path d="M1864 120h-18M1864 320h-18M1864 520h-18M1864 720h-18M1864 920h-18"/>
  </g>
</svg>
