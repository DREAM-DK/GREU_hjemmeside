<svg xmlns="http://www.w3.org/2000/svg" width="184" height="184" viewBox="0 0 184 184" role="img" aria-labelledby="t d">
  <title id="t">GreenREFORM-EU - Simultaneity mark</title>
  <desc id="d">Two blocks of a single equation system, joined at one coupling cell.</desc>
  <defs>
    <clipPath id="tile"><rect width="184" height="184" rx="40"/></clipPath>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#19E3A7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#19E3A7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="184" height="184" fill="#0C1116"/>
    <circle cx="92" cy="92" r="58" fill="url(#glow)"/>

    <!-- faint lattice: every cell of the system -->
    <g fill="#1B2733">
      <rect x="24" y="24" width="16" height="16" rx="3"/><rect x="44" y="24" width="16" height="16" rx="3"/><rect x="64" y="24" width="16" height="16" rx="3"/><rect x="84" y="24" width="16" height="16" rx="3"/><rect x="104" y="24" width="16" height="16" rx="3"/><rect x="124" y="24" width="16" height="16" rx="3"/><rect x="144" y="24" width="16" height="16" rx="3"/>
      <rect x="24" y="44" width="16" height="16" rx="3"/><rect x="44" y="44" width="16" height="16" rx="3"/><rect x="64" y="44" width="16" height="16" rx="3"/><rect x="84" y="44" width="16" height="16" rx="3"/><rect x="104" y="44" width="16" height="16" rx="3"/><rect x="124" y="44" width="16" height="16" rx="3"/><rect x="144" y="44" width="16" height="16" rx="3"/>
      <rect x="24" y="64" width="16" height="16" rx="3"/><rect x="44" y="64" width="16" height="16" rx="3"/><rect x="64" y="64" width="16" height="16" rx="3"/><rect x="84" y="64" width="16" height="16" rx="3"/><rect x="104" y="64" width="16" height="16" rx="3"/><rect x="124" y="64" width="16" height="16" rx="3"/><rect x="144" y="64" width="16" height="16" rx="3"/>
      <rect x="24" y="84" width="16" height="16" rx="3"/><rect x="44" y="84" width="16" height="16" rx="3"/><rect x="64" y="84" width="16" height="16" rx="3"/><rect x="104" y="84" width="16" height="16" rx="3"/><rect x="124" y="84" width="16" height="16" rx="3"/><rect x="144" y="84" width="16" height="16" rx="3"/>
      <rect x="24" y="104" width="16" height="16" rx="3"/><rect x="44" y="104" width="16" height="16" rx="3"/><rect x="64" y="104" width="16" height="16" rx="3"/><rect x="84" y="104" width="16" height="16" rx="3"/><rect x="104" y="104" width="16" height="16" rx="3"/><rect x="124" y="104" width="16" height="16" rx="3"/><rect x="144" y="104" width="16" height="16" rx="3"/>
      <rect x="24" y="124" width="16" height="16" rx="3"/><rect x="44" y="124" width="16" height="16" rx="3"/><rect x="64" y="124" width="16" height="16" rx="3"/><rect x="84" y="124" width="16" height="16" rx="3"/><rect x="104" y="124" width="16" height="16" rx="3"/><rect x="124" y="124" width="16" height="16" rx="3"/><rect x="144" y="124" width="16" height="16" rx="3"/>
      <rect x="24" y="144" width="16" height="16" rx="3"/><rect x="44" y="144" width="16" height="16" rx="3"/><rect x="64" y="144" width="16" height="16" rx="3"/><rect x="84" y="144" width="16" height="16" rx="3"/><rect x="104" y="144" width="16" height="16" rx="3"/><rect x="124" y="144" width="16" height="16" rx="3"/><rect x="144" y="144" width="16" height="16" rx="3"/>
    </g>

    <!-- macroeconomic block -->
    <g fill="#2D2BE0">
      <rect x="24" y="24" width="16" height="16" rx="3"/><rect x="44" y="24" width="16" height="16" rx="3"/><rect x="64" y="24" width="16" height="16" rx="3"/>
      <rect x="24" y="44" width="16" height="16" rx="3"/><rect x="44" y="44" width="16" height="16" rx="3"/><rect x="64" y="44" width="16" height="16" rx="3"/>
      <rect x="24" y="64" width="16" height="16" rx="3"/><rect x="44" y="64" width="16" height="16" rx="3"/><rect x="64" y="64" width="16" height="16" rx="3"/>
    </g>

    <!-- energy technology block -->
    <g fill="#F1EEE6">
      <rect x="104" y="104" width="16" height="16" rx="3"/><rect x="124" y="104" width="16" height="16" rx="3"/><rect x="144" y="104" width="16" height="16" rx="3"/>
      <rect x="104" y="124" width="16" height="16" rx="3"/><rect x="124" y="124" width="16" height="16" rx="3"/><rect x="144" y="124" width="16" height="16" rx="3"/>
      <rect x="104" y="144" width="16" height="16" rx="3"/><rect x="124" y="144" width="16" height="16" rx="3"/><rect x="144" y="144" width="16" height="16" rx="3"/>
    </g>

    <!-- the coupling: the cells that make it one system -->
    <g fill="#19E3A7">
      <rect x="84" y="84" width="16" height="16" rx="3"/>
      <rect x="64" y="84" width="16" height="16" rx="3" opacity=".42"/>
      <rect x="84" y="64" width="16" height="16" rx="3" opacity=".42"/>
      <rect x="104" y="84" width="16" height="16" rx="3" opacity=".42"/>
      <rect x="84" y="104" width="16" height="16" rx="3" opacity=".42"/>
    </g>
  </g>
</svg>
