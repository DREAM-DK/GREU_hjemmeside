<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.4 -0.1 282.6 50.9" role="img" aria-label="DREAM">
  <desc>DREAM's institutional wordmark in white, for dark backgrounds. The five
letter paths are the same artwork as assets/dream-wordmark.svg, taken from
DREAM_logo_footer.svg in the 2021 logo pack. White is DREAM's own reversed
colour: the pack supplies DREAM_Logo_Hvid_100mm_RGB.svg for exactly this case.
That file draws the same letterforms at a smaller scale inside a lockup with
the institute's name set as outlines; this site sets the name as live text
instead, which is what dreamgruppen.dk does in its own footer.</desc>
