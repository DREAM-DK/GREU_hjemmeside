<svg xmlns="http://www.w3.org/2000/svg" width="184" height="184" viewBox="0 0 283.46 283.46" role="img" aria-labelledby="t d">
  <title id="t">GreenREFORM-EU</title>
  <desc id="d">The model disc. GREEN and REFORM are the outlines from DREAM's own
Modellogo_GREEN_REFORM_100mm_RGB.svg, unaltered, so the lettering is the same
bespoke alphabet as the DREAM wordmark and the other model discs. The E of EU
is that logo's own E. DREAM's alphabet has never been drawn with a U, so the U
here is constructed from the alphabet's own metrics: the stroke, corner radius
and width are the O of REFORM scaled by 0.6156, the same factor that relates
GREEN to REFORM. Replace it if DREAM supplies a drawn U. The green is #10693A,
the GreenREFORM-EU value, not the #31B149 of the Danish parent.</desc>

  <circle cx="141.73" cy="141.73" r="141.73" fill="#10693A"/>

